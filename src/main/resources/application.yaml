spring:
  application:
    name: hamster-clinic

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:hamster_clinic}
    username: ${POSTGRES_USER:hamster_user}
    password: ${POSTGRES_PASSWORD:hamster_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

application:
  security:
    jwt:
      secret-key: SdPvYsuherTtFgzn3ogifQBfSNilyhOeEMltzlmBHBU=
      expiration: 3600000

server:
  port: 8080